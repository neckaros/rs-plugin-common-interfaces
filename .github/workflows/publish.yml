name: Test and publish crate

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/publish.yml
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test crate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Test all features
        run: cargo test --all-features --locked
      - name: Verify package contents
        run: cargo publish --dry-run --all-features --locked

  publish:
    name: Publish new version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          crate_name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 \
            --header 'User-Agent: rs-plugin-common-interfaces GitHub Actions publisher' \
            "https://crates.io/api/v1/crates/${crate_name}/${crate_version}")"

          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *)
              echo "Unexpected crates.io response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

          echo "crate=${crate_name}" >> "$GITHUB_OUTPUT"
          echo "version=${crate_version}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.version.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: steps.version.outputs.published == 'false'
        run: cargo publish --all-features --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Report existing version
        if: steps.version.outputs.published == 'true'
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate }}
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        run: echo "${CRATE_NAME} ${CRATE_VERSION} is already published; skipping."
